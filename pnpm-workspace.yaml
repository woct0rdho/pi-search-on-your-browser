minimumReleaseAgeExclude:
  - "@earendil-works/*"
# Dev-only transitive dependencies of pi; their install scripts are not
# needed for typechecking or the test suite (and pnpm blocks them by default).
# strictDepBuilds=false keeps `pnpm install` successful with those blocks in
# place instead of exiting with ERR_PNPM_IGNORED_BUILDS.
strictDepBuilds: false
ignoredBuiltDependencies:
  - '@google/genai'
  - esbuild
  - protobufjs
